[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docmorph"
version = "0.1.0"
description = "Convertisseur universel de documents, 100 % local (WSL2 Ubuntu)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "pdf2docx>=0.5.8",
    "img2pdf>=0.5",
    "pillow>=10",
    "python-magic>=0.4.27",
    "ocrmypdf>=16.0",
]

[project.optional-dependencies]
structure = ["docling>=2.139,<3"]
dev = ["pytest>=8", "httpx>=0.27", "python-docx>=1.1"]

[tool.setuptools.packages.find]
include = ["docmorph*"]

[tool.setuptools.package-data]
"docmorph.web" = ["*.html", "*.js", "*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "libreoffice: requires the soffice binary",
    "ocr: requires tesseract and ocrmypdf",
    "structure: requires docling and pandoc (slow)",
]
